# The nightly backup (#35, ADR-0010). Every night: dump production, restore the
# dump into a scratch Postgres on this runner and check it came back whole,
# encrypt it, and put it in a bucket that belongs neither to Neon nor to GitHub.
#
# The restore is not a separate drill run now and then. It is a step of every
# backup, and a dump that fails it is never uploaded. So the newest object in the
# bucket has always been restored once, and the run page says how long that took.
#
# docs/runbooks/backup-and-restore.md is the operational half: the one-time
# setup, where the backups are, and how to restore production from one.
name: Backup

on:
  schedule:
    # 08:17 UTC is 04:17 in Indianapolis in summer and 03:17 in winter: the
    # quietest hour, and off the top of the hour, where GitHub's scheduled
    # runs queue up and start late.
    - cron: "17 8 * * *"
  # A backup on demand, before a risky migration or to try the setup. It runs
  # from whichever branch is chosen, but the environment below gives its secrets
  # only to `main`.
  workflow_dispatch:

# Checkout, and nothing else. Nothing here writes to the repository.
permissions:
  contents: read

# One at a time, and never cancelled part-way. A run started by hand while the
# nightly one is going waits for it rather than dumping alongside it.
concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    name: Back up production, and restore it
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The backup login can read every row of every org, so its credential lives
    # where `PRODUCTION_DATABASE_URL` does, and for the reason `ci.yml` gives: in
    # an environment whose deployment branch rule allows only `main`, not in a
    # repository secret that any branch's workflow could print. An environment
    # of its own rather than `production`, so this job cannot read the
    # migration credential and the migration job cannot read this one.
    #
    # `deployment: false` stops every nightly run appearing as a deployment.
    environment:
      name: backups
      deployment: false

    services:
      # The scratch database the dump is restored into. Postgres 18 for the
      # reason `ci.yml` gives, and so that it matches production. The committed
      # local credential, because it guards an empty server on a runner that is
      # destroyed minutes later.
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: capexwise
          POSTGRES_PASSWORD: capexwise_local_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U capexwise -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    env:
      # `capexwise_backup`, on Neon's direct endpoint: the host without
      # `-pooler`, because `pg_dump` shares a snapshot with the session that
      # counts the rows, and a pooler cannot hold one for it. The login holds
      # `capexwise_reader` and nothing else (`drizzle/0007`).
      BACKUP_SOURCE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      # `src/db/backup.mts` drops and recreates this database on every run, and
      # refuses one whose name does not end in `_restore`.
      BACKUP_RESTORE_URL: postgresql://capexwise:capexwise_local_dev@127.0.0.1:5432/capexwise_restore

    steps:
      # Everything this job needs, checked before it does anything, so that a
      # setup that is half done fails in a second and names every missing
      # piece at once rather than one per night.
      - name: Check the setup
        env:
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_REGION: ${{ vars.BACKUP_S3_REGION }}
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          missing=""

          for name in BACKUP_SOURCE_URL BACKUP_S3_ACCESS_KEY_ID \
            BACKUP_S3_SECRET_ACCESS_KEY BACKUP_S3_ENDPOINT BACKUP_S3_REGION \
            BACKUP_S3_BUCKET BACKUP_AGE_RECIPIENT; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done

          if [ -n "$missing" ]; then
            # BACKUP_SOURCE_URL is the job's name for the secret
            # BACKUP_DATABASE_URL, so the message uses the name to set.
            echo "::error::Set these in the backups environment:${missing/BACKUP_SOURCE_URL/BACKUP_DATABASE_URL}. docs/runbooks/backup-and-restore.md has the setup."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Postgres 18's client tools, because `pg_dump` refuses to dump a server
      # newer than itself and the runner's own are older. From the PostgreSQL
      # project's apt repository, which `postgresql-common` knows how to add.
      # And `age`, which encrypts the dump below.
      - name: Install pg_dump 18 and age
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-18 age
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      # Dump, restore, compare, and write the timings to the run's summary.
      # `src/db/backup.mts` says what each step checks. The file is plaintext
      # until the next step, in the runner's temporary directory, which is
      # destroyed with the runner.
      - name: Back up, restore and compare
        run: npm run db:backup -- "$RUNNER_TEMP/capexwise.dump"

      # To a public key, so that the private half is needed only to restore and
      # never sits anywhere this job can reach. It is in the password manager,
      # beside production's ACCESS_CODE_KEYS, and ADR-0010 says why losing it
      # loses every backup.
      - name: Encrypt
        env:
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          age --encrypt --recipient "$BACKUP_AGE_RECIPIENT" \
            --output "$RUNNER_TEMP/capexwise.dump.age" "$RUNNER_TEMP/capexwise.dump"
          rm "$RUNNER_TEMP/capexwise.dump"

      # Any S3-compatible bucket: the endpoint and region say which provider.
      # The key can write and cannot delete, where the provider allows that, and
      # the bucket's lifecycle rule deletes each object 90 days after it is
      # written. Neither is this job's to enforce, so the runbook's setup does
      # both.
      #
      # The two checksum settings keep AWS CLI v2 from sending the CRC checksum
      # headers it now adds by default, which S3-compatible providers have
      # rejected. `aws s3 cp` still checks the upload's MD5.
      - name: Upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.BACKUP_S3_REGION }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
        run: |
          set -euo pipefail

          # One object per run, named for the moment it was taken, under the
          # prefix the lifecycle rule applies to. A timestamp rather than a date
          # so that a run by hand never replaces the night's.
          key="nightly/$(date -u +%Y-%m-%dT%H%M%SZ).dump.age"

          aws s3 cp "$RUNNER_TEMP/capexwise.dump.age" "s3://$BACKUP_S3_BUCKET/$key" \
            --endpoint-url "$BACKUP_S3_ENDPOINT" --no-progress

          echo "Uploaded \`$key\`." >> "$GITHUB_STEP_SUMMARY"
