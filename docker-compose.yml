# Local development database. Not a production artifact and not a model of one —
# production Postgres is managed and provisioned in #33; the app container is #19.
#
# Postgres is pinned to major 18 because ADR-0005 makes `uuidv7()` the primary
# key default, which is a Postgres 18 built-in. Local and production have to
# agree on the major or a migration that works here fails there. The pin is
# major-only: patch releases within a major are compatible, and a digest pin on
# a throwaway dev database would need bumping constantly for no safety gain.
# (The app image in #19 does pin a digest — that one ships.)
#
# The Debian image rather than `-alpine` on purpose. Alpine links musl, whose
# collation differs from the glibc/ICU collation every managed provider runs, so
# `ORDER BY` on text can disagree between a developer's machine and production.

# The project name is pinned rather than inherited from the directory name, which
# is what Compose does by default. This checkout is still called `propex` from
# before the rename, so the default would be `propex` here and `capexwise`
# after renaming the folder — and Compose would then treat the two as unrelated
# projects. A `db:down` from the renamed folder silently does nothing while the
# old container keeps holding port 5432, and the next `db:up` fails on a
# container-name conflict rather than on anything that points at the cause.
name: capexwise

services:
  postgres:
    image: postgres:18
    container_name: capexwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: capexwise
      POSTGRES_USER: capexwise
      # Local-only credential for a database that holds no real data, so it is
      # committed deliberately rather than being a leaked secret. It is safe
      # only because of the loopback bind below — never reuse this password for
      # anything reachable from off the machine.
      POSTGRES_PASSWORD: capexwise_local_dev
      # scram-sha-256 rather than the trust auth people reach for locally, so a
      # missing password fails here instead of in preview.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      # Bound to loopback, not 0.0.0.0. The bare `5432:5432` form publishes the
      # database to every host on the local network, and on a laptop that means
      # whatever coffee-shop wifi it is joined to.
      - "127.0.0.1:5432:5432"
    volumes:
      # Named, so data survives `db:down` and a machine restart. `db:reset`
      # removes it; that is the documented way to start clean.
      #
      # `/var/lib/postgresql`, NOT the `/var/lib/postgresql/data` that every
      # pre-18 example uses. Postgres 18 made PGDATA version-specific
      # (`/var/lib/postgresql/18/docker`) and moved the image's VOLUME up one
      # level, so the old path mounts a directory the server does not write to:
      # the container comes up healthy, the named volume stays empty, and the
      # real data goes into an anonymous volume that a `down` throws away.
      # Nothing errors — it just silently stops persisting.
      - capexwise-pgdata:/var/lib/postgresql
    healthcheck:
      # `docker compose up -d` returns as soon as the container starts, which is
      # before Postgres accepts connections — the reason a migration run
      # immediately after "up" fails with a connection error. `db:up` passes
      # `--wait`, which waits on this.
      #
      # `-h 127.0.0.1` matters: it forces the check onto TCP, which is what a
      # client actually connects over. Bare `pg_isready` probes the unix socket
      # instead, and on a first run that socket answers too early — the
      # entrypoint runs initdb and then starts a temporary socket-only server
      # (`listen_addresses=''`) to execute init scripts. A socket check passes
      # against that, the container is marked healthy, `--wait` returns, and the
      # migration on the next line hits a port with nothing listening yet.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U capexwise -d capexwise"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # The container from #19 and ADR-0002, behind a profile so it is inert for the
  # normal `npm run db:up` — Compose starts no profiled service unless asked. It is
  # here because the Dockerfile is only an escape hatch while someone runs it, and
  # `npm run docker:up` is the one command that makes running it the easy path.
  #
  # This is not how the application is deployed. Production is Vercel today and
  # Cloud Run at the trigger, and both get their configuration from the
  # environment; this service exists so the image is exercised against a real
  # database before that move, not to model either one.
  app:
    profiles: ["app"]
    build:
      context: .
    image: capexwise-app
    container_name: capexwise-app
    restart: unless-stopped
    environment:
      # `postgres`, the service name — not the `127.0.0.1` that `.env.local` uses.
      # Inside a container loopback is the container, so pasting the host string in
      # here yields a connection refused that reads like the database is down.
      DATABASE_URL: postgresql://capexwise:capexwise_local_dev@postgres:5432/capexwise
      # 3001 because that is the port this service is published on below, and the
      # OAuth callback is built from this value. A Google client whose redirect
      # URIs do not include `http://localhost:3001/api/auth/callback/google` will
      # refuse the round trip from here even though it works under `npm run dev`.
      APP_URL: http://localhost:3001
      # Local-only, like the database password above and for the same reason:
      # this service exists to prove the image boots and serves against a real
      # database, and nothing it signs outlives the container. Never promote it.
      BETTER_AUTH_SECRET: compose-only-not-a-secret-compose-only-not-a-secret
      # Read from the host if they are set — a real sign-in through the image
      # needs a real client — and obviously fake otherwise, so the server still
      # boots. `${VAR:-default}` is compose's own substitution; it reads `.env`
      # in this directory, not `.env.local`, so exporting them in the shell is
      # the way to hand real values in.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-compose-only-not-a-real-client}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-compose-only-not-a-real-secret}
    ports:
      # 3001, not 3000, so this and `npm run dev` can both be up. Loopback-bound
      # for the same reason the database is.
      - "127.0.0.1:3001:3000"
    depends_on:
      postgres:
        # Waits for the healthcheck above, not merely for the container to exist.
        condition: service_healthy

volumes:
  capexwise-pgdata:
    name: capexwise-pgdata
